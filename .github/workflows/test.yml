name: Tests

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-xcb1
        shell: bash

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
        shell: bash

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --cov=diskcleaner --cov-report=xml --cov-report=term
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9' && success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black==23.3.0" "isort==5.12.0" "flake8==6.0.0" mypy

      - name: Check code formatting with black
        run: |
          black --check diskcleaner/ tests/
        shell: bash

      - name: Check import sorting with isort
        run: |
          isort --check-only diskcleaner/ tests/
        shell: bash

      - name: Lint with flake8
        run: |
          flake8 diskcleaner/ tests/ --max-line-length=100 --extend-ignore=E203,E231,W503,F841,F401,F541,E731,E302,E402,E722,E501,F821
          echo "Lint checks completed"
        shell: bash

      - name: Type check with mypy
        run: mypy diskcleaner/ --config-file=mypy.ini || true
