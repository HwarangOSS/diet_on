name: PR Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fuxingloh/multi-labeler@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
